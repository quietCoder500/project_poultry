{% load widget_tweaks %}
<div>
    <form action="/projects/{{ item.project.slug }}/edit" method="post"
          id="edit-form-{{ item.project.slug }}" class="pb-4 flex flex-col gap-2">
        <div class="flex items-center">
            <hr class="grow border-t border-base-200">
            <span class="px-16 text-base-content font-semibold">Edit</span>
            <hr class="grow border-t border-base-200">
        </div>
        {% csrf_token %}

        <div class="flex gap-0.5 flex-col">
            <label for="{{ item.edit_form.title.id_for_label }}" class="label">
                Title
            </label>
            {{ item.edit_form.title|add_class:"input" }}
        </div>
        <div class="flex gap-0.5 flex-col">
            <label for="{{ item.edit_form.is_livestock.id_for_label }}" class="label">
                Livestock Project
            </label>
            {{ item.edit_form.is_livestock|add_class:"checkbox" }}
        </div>
        <div class="flex gap-0.5 flex-col">
            <label for="{{ item.edit_form.started_at.id_for_label }}" class="label">
                Started Date
            </label>
            {{ item.edit_form.started_at|add_class:"input" }}
        </div>

    </form>
    <div class="flex flex-col sm:flex-row sm:justify-between gap-2">
        <div>
            <button type="submit" class="btn btn-primary w-full sm:w-auto"
                    form="edit-form-{{ item.project.slug }}">
                Save
            </button>
        </div>
        <div class="flex flex-row justify-between sm:justify-normal gap-4">
            <form method="post" action="/projects/{{ item.project.slug }}/complete">
                {% csrf_token %}
                <button type="submit" class="btn btn-secondary">
                    Complete Project
                </button>
            </form>
            <form method="post" action="/projects/{{ item.project.slug }}/delete">
                {% csrf_token %}
                <button type="submit" class="btn btn-error">
                    Delete
                </button>
            </form>
        </div>
    </div>
</div>
